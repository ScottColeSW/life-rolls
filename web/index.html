<meta charset="utf-8">
<title>Life Rolls</title>
<style>
  :root {
    --bg: #0b0714;
    --panel: #191228;
    --panel-2: #241a3a;
    --line: #3a2c56;
    --text: #eee9fb;
    --dim: #a99bcf;
    --accent: #f2b53c;
    --pulse: #58d1ff;
    --true: #34c77b;
    --bluff: #e6534f;
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }
  h1 { text-align: center; letter-spacing: 0.1em; font-size: 1.9rem; margin: 0 0 4px; text-shadow: 0 0 18px rgba(242,181,60,0.4); }
  .tagline { text-align: center; color: var(--dim); margin: 0 0 20px; font-size: 0.9rem; }

  .controls { display: flex; justify-content: center; gap: 14px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #1a1400; border: none; border-radius: 8px;
    padding: 10px 22px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  label { color: var(--dim); font-size: 0.85rem; }

  #status { text-align: center; color: var(--dim); min-height: 1.4em; margin-bottom: 14px; font-size: 0.9rem; }

  #reveal-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 999; }
  #reveal-flash.true { background: var(--true); animation: flashFade 0.6s ease-out; }
  #reveal-flash.bluff { background: var(--bluff); animation: flashFade 0.6s ease-out; }
  #reveal-flash.spoton-hit { background: var(--accent); animation: flashFade 0.8s ease-out; }
  #reveal-flash.spoton-miss { background: var(--bluff); animation: flashFade 0.6s ease-out; }
  @keyframes flashFade { 0% { opacity: 0.3; } 100% { opacity: 0; } }

  #console {
    max-width: 640px;
    margin: 0 auto 16px;
    background: #05070a;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: "Courier New", monospace;
    font-size: 0.82rem;
    color: #7cfc9a;
    min-height: 100px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  #console div { opacity: 0; animation: fadein 0.3s forwards; padding: 1px 0; }

  .board-row {
    display: flex; justify-content: center; align-items: flex-start;
    gap: 16px; flex-wrap: wrap; max-width: 1040px; margin: 0 auto;
  }
  #table-wrap {
    position: relative;
    width: 100%;
    max-width: 820px;
    height: 520px;
    margin: 0 0 16px;
    display: none;
    overflow: hidden;
    border-radius: 16px;
  }
  /* Roster panel -- replaces the old single long "live: A -> modelX, B ->
     modelY, ..." status string with a proper per-seat badge list beside
     the board (Scott: "instead of a long string of our competitors at
     the top, can we have a player/model/online list badge on the side of
     the play board?"). Online status is polled from /api/models, cross-
     referenced against the actual TEXT_MODELS pool via Ollama's own
     /api/tags, same as the sibling Dominion project's roster panel. */
  #roster-panel {
    display: none;
    width: 190px;
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  #roster-panel.visible { display: block; }
  .roster-title { color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; margin-bottom: 8px; }
  .roster-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--panel-2); font-size: 0.78rem; }
  .roster-row:last-child { border-bottom: none; }
  .roster-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--dim); }
  .roster-dot.online { background: var(--true); box-shadow: 0 0 6px var(--true); }
  .roster-dot.offline { background: var(--bluff); }
  .roster-info { flex: 1; min-width: 0; }
  .roster-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster-model { color: var(--dim); font-size: 0.72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .curtain-panel {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    background: linear-gradient(180deg, #241a3a 0%, #0d0a1a 100%);
    z-index: 50;
    transition: transform 0.9s cubic-bezier(.7,0,.3,1);
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  .curtain-panel.left { left: 0; border-right: 2px solid var(--accent); }
  .curtain-panel.right { right: 0; border-left: 2px solid var(--accent); }
  .curtain-panel.left.open { transform: translateX(-100%); }
  .curtain-panel.right.open { transform: translateX(100%); }
  #table-surface {
    position: absolute;
    left: 50%; top: 50%;
    width: 78%; height: 70%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #2c2050 0%, #1a1430 65%, #0d0a1a 100%);
    border: 6px solid #3a2c56;
    box-shadow: 0 0 40px rgba(88, 60, 160, 0.35) inset;
  }
  .billboard {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 200px; text-align: center;
    background: #05070a; border: 3px solid var(--accent); border-radius: 12px;
    padding: 10px 14px; font-family: "Courier New", monospace; color: var(--accent);
    box-shadow: 0 0 18px rgba(242,181,60,0.35) inset;
  }
  .billboard .round-label { display: block; font-size: 0.62rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .billboard .bid-value { display: block; font-size: 1rem; font-weight: 700; margin-top: 4px; }
  .billboard.palafox { border-color: var(--bluff); animation: palafoxPulse 1.2s ease-in-out infinite; }
  .billboard.palafox .round-label { color: var(--bluff); }
  @keyframes palafoxPulse {
    0%, 100% { box-shadow: 0 0 18px rgba(230,83,79,0.35) inset; }
    50% { box-shadow: 0 0 30px rgba(230,83,79,0.7) inset; }
  }

  .seat {
    position: absolute;
    width: 168px;
    transform: translate(-50%, -50%);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 10px 10px 8px;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s, opacity 0.5s, filter 0.5s;
  }
  .seat .avatar { font-size: 1.8rem; position: relative; display: inline-block; }
  /* "Thinking" indicator -- a small pulsing badge shown only while a live
     model's real Ollama round-trip is actually in flight for this seat's
     turn (see engine/liars_dice.py's player_thinking event). Scott: "I'd
     like to see a 'thinking' icon when the model is invoked for a turn." */
  .seat .thinking-badge { display: none; position: absolute; top: -6px; right: -14px; font-size: 1rem; }
  .seat.thinking .thinking-badge { display: inline-block; animation: thinkPulse 1s ease-in-out infinite; }
  @keyframes thinkPulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .seat .name { font-weight: 700; font-size: 0.82rem; margin: 2px 0; }
  .seat .model-badge { display: inline-block; font-size: 0.6rem; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--dim); border: 1px solid var(--line); margin-bottom: 4px; }
  .seat .model-badge.live { color: var(--accent); border-color: var(--accent); background: rgba(242,181,60,0.12); }
  .seat .dice-row { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; min-height: 38px; }
  /* Real CSS-drawn dice -- a 3x3 grid of pips, exactly like a physical
     die face, not a font glyph. Unicode die-face characters (U+2680-2685)
     depend entirely on font support and render as barely-visible or
     generic boxes on plenty of real systems -- this can't fail to render
     the same way everywhere, since it's plain divs, not a character. */
  .die-face {
    display: inline-grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 34px;
    height: 34px;
    background: #f2eee2;
    border: 2px solid #1a1428;
    border-radius: 7px;
    padding: 4px;
    gap: 2px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.45);
    flex-shrink: 0;
  }
  .die-face .pip { border-radius: 50%; background: #1a1428; align-self: center; justify-self: center; width: 70%; height: 70%; }
  .die-face.hidden-die {
    background: linear-gradient(145deg, #3a2c56, #1e1533);
    border-color: var(--dim);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-weight: 800;
    font-size: 1.1rem;
  }
  .die-face.match { border-color: var(--true); box-shadow: 0 0 10px rgba(52,199,123,0.9); }
  .seat.active-turn { border-color: var(--pulse); box-shadow: 0 0 22px rgba(88,209,255,0.55); }
  .seat.eliminated { opacity: 0.35; filter: grayscale(1); }
  .seat.eliminated .name::after { content: " \2620 OUT"; color: var(--bluff); }
  .seat.winner { border-color: var(--accent); box-shadow: 0 0 30px rgba(242,181,60,0.75); animation: winnerPulse 1s ease-in-out infinite alternate; }
  @keyframes winnerPulse { from { box-shadow: 0 0 20px rgba(242,181,60,0.5); } to { box-shadow: 0 0 38px rgba(242,181,60,0.9); } }

  .round-log {
    max-width: 640px;
    margin: 0 auto 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    min-height: 90px;
    max-height: 160px;
    overflow-y: auto;
    display: none;
  }
  .round-log div { padding: 2px 0; opacity: 0; animation: fadein 0.35s forwards; }
  .round-log .banner { color: var(--accent); font-weight: 700; text-align: center; margin: 6px 0; }
  .round-log .verdict-true { color: var(--true); font-weight: 700; }
  .round-log .verdict-bluff { color: var(--bluff); font-weight: 700; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .winner-banner {
    max-width: 640px; margin: 16px auto 0; text-align: center;
    font-size: 1.3rem; font-weight: 800; color: var(--accent);
    display: none; text-shadow: 0 0 20px rgba(242,181,60,0.6);
  }
</style>

<div id="reveal-flash"></div>
<h1>LIFE ROLLS</h1>
<p class="tagline">liar's dice. death on the line, one lie at a time.</p>

<div class="controls">
  <label>players
    <select id="player-count">
      <option value="5" selected>5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
    </select>
  </label>
  <button id="start-btn">Start Tournament</button>
  <label><input type="checkbox" id="live-toggle" checked> live Ollama (falls back to scripted)</label>
</div>
<div id="status"></div>
<div id="console"></div>

<div class="board-row">
  <div id="table-wrap">
    <div class="curtain-panel left" id="curtain-left"></div>
    <div class="curtain-panel right" id="curtain-right"></div>
    <div id="table-surface"></div>
    <div class="billboard" id="billboard">
      <span class="round-label">round -</span>
      <span class="bid-value" id="billboard-value">waiting...</span>
    </div>
  </div>
  <div id="roster-panel">
    <div class="roster-title">Table</div>
    <div id="roster-rows"></div>
  </div>
</div>

<div class="round-log" id="round-log"></div>
<div class="winner-banner" id="winner-banner"></div>

<footer style="text-align:center; margin-top:32px; font-size:0.8rem;">
  <a href="stats.html" style="color:var(--dim); text-decoration:none;">Standings</a>
  &middot;
  <a href="about.html" target="_blank" rel="noopener noreferrer" style="color:var(--dim); text-decoration:none;">About</a>
</footer>

<script>
const AVATAR = {
  "The CFO": "\u{1F4BC}", "The Executor": "\u{1F4DC}", "The Union Rep": "✊",
  "The Founder": "\u{1F680}", "The Diplomat": "\u{1F91D}", "The Adjuster": "\u{1F9EE}",
  "The Diner Owner": "\u{1F373}", "The Night-Shift Nurse": "\u{1F3E5}",
  "The Long-Haul Trucker": "\u{1F69A}", "The Immigrant Shop Owner": "\u{1F3EA}",
  "The Gig Worker": "\u{1F4F1}",
};
// 3x3 grid positions (row-major, 0-8) that hold a pip for each face --
// the standard physical-die pip layout.
const PIP_PATTERNS = {
  1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8],
};

function dieFaceHTML(value, matchFace) {
  if (value == null) return `<div class="die-face hidden-die">?</div>`;
  const pips = PIP_PATTERNS[value] || [];
  const cells = Array.from({ length: 9 }, (_, i) => pips.includes(i) ? `<div class="pip"></div>` : `<div></div>`).join("");
  const isMatch = matchFace != null && (value === matchFace || (matchFace !== 1 && value === 1));
  return `<div class="die-face${isMatch ? " match" : ""}">${cells}</div>`;
}

const $ = (id) => document.getElementById(id);
let current = null;

// ---- roster panel: player/model/online badges beside the board,
// replacing the old single long status string. modelRoster is keyed by
// model tag -> {online, display_name}, refreshed periodically since
// whether Ollama is up/down or a model is installed can change while the
// page stays open (same reasoning as Dominion's own roster panel).
let modelRoster = {};

async function pollModelRoster() {
  try {
    const res = await fetch("/api/models");
    const data = await res.json();
    modelRoster = {};
    for (const m of data.models) modelRoster[m.tag] = m;
  } catch (e) {
    // Server unreachable or mid-restart -- keep whatever roster data we
    // already had rather than blanking the panel over a transient blip.
  }
  renderRosterPanel();
}
setInterval(pollModelRoster, 5000);
pollModelRoster();

function renderRosterPanel() {
  if (!current) return;
  const rows = current.personas.map((p, i) => {
    const modelTag = current.models[i];
    let dotClass = "offline", label = "scripted";
    if (modelTag) {
      const info = modelRoster[modelTag];
      const online = info ? info.online : false;
      dotClass = online ? "online" : "offline";
      label = (info && info.display_name) || modelTag;
    }
    return `<div class="roster-row">
      <span class="roster-dot ${dotClass}"></span>
      <div class="roster-info">
        <div class="roster-name">${p.archetype_name}</div>
        <div class="roster-model">${label}</div>
      </div>
    </div>`;
  }).join("");
  $("roster-rows").innerHTML = rows;
  $("roster-panel").classList.add("visible");
}

// ---- sound: synthesized tones via Web Audio API, no audio files needed.
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, duration, type, peakGain) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  gain.gain.setValueAtTime(0, ctx.currentTime + start);
  gain.gain.linearRampToValueAtTime(peakGain || 0.15, ctx.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + duration + 0.05);
}
function sfxRaise() { tone(520, 0, 0.1, "triangle", 0.1); }
function sfxCall() { tone(180, 0, 0.3, "sawtooth", 0.15); tone(140, 0.05, 0.3, "sawtooth", 0.12); }
function sfxExecuted() { tone(110, 0, 0.5, "square", 0.18); tone(90, 0.15, 0.5, "square", 0.15); }
function sfxTrue() { tone(523, 0, 0.15, "sine", 0.15); tone(659, 0.1, 0.2, "sine", 0.16); }
function sfxBluff() { tone(220, 0, 0.2, "sawtooth", 0.18); tone(196, 0.15, 0.35, "sawtooth", 0.18); }
function sfxWinner() { tone(523, 0, 0.15, "sine", 0.15); tone(659, 0.12, 0.15, "sine", 0.15); tone(784, 0.24, 0.4, "sine", 0.2); }
function sfxSpotOnHit() { tone(784, 0, 0.1, "sine", 0.2); tone(988, 0.08, 0.1, "sine", 0.2); tone(1175, 0.16, 0.25, "sine", 0.22); }
function sfxSpotOnMiss() { tone(300, 0, 0.15, "square", 0.16); tone(220, 0.1, 0.3, "square", 0.15); }
function sfxPalafox() { tone(80, 0, 0.6, "sawtooth", 0.16); tone(83, 0.05, 0.6, "sawtooth", 0.1); }

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Named, tunable in one place -- a full tournament needs a structural
// minimum of (players-1) * HAND_SIZE lost rounds before one winner
// remains (engine/liars_dice.py's HAND_SIZE=3), so with 5 players that's
// at least 12 rounds no matter how fast any single beat animates. These
// are floors, not fixed waits: in live mode the real Ollama round-trip
// already took real time server-side before its event ever reached the
// browser, so the consumer loop below rarely has to wait this long in
// practice -- it only kicks in when events arrive faster than a human
// could read them (the common case in scripted mode, and the reason
// events queue up instead of rendering instantly the moment they arrive).
const PACE = {
  preflight: 120,
  roundStart: 150,
  turn: 180,
  execution: 200,
  preReveal: 150,
  verdictPause: 500,
  postRound: 150,
};

function consoleLine(text) {
  const box = $("console");
  const div = document.createElement("div");
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// Decouples "how fast events arrive" from "how fast they're displayed."
// The stream reader pushes into this as fast as the network/server
// delivers (instantly, in scripted mode; paced by real model latency in
// live mode); a separate consumer drains it at its own pace (see PACE
// above), so live mode's real wait becomes visible AS it happens instead
// of the browser sitting on a blank screen until the whole tournament is
// already over.
class EventQueue {
  constructor() { this.items = []; this.resolvers = []; this.done = false; }
  push(item) {
    if (this.resolvers.length) this.resolvers.shift()(item);
    else this.items.push(item);
  }
  finish() {
    this.done = true;
    while (this.resolvers.length) this.resolvers.shift()(null);
  }
  async next() {
    if (this.items.length) return this.items.shift();
    if (this.done) return null;
    return new Promise((resolve) => this.resolvers.push(resolve));
  }
}

function layoutSeats(n) {
  const wrap = $("table-wrap");
  const rect = wrap.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const rx = rect.width * 0.44, ry = rect.height * 0.40;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + rx * Math.cos(angle);
    const y = cy + ry * Math.sin(angle);
    const seat = $("seat-" + i);
    seat.style.left = x + "px";
    seat.style.top = y + "px";
  }
}

function seatHTML(i, persona, model) {
  const avatar = AVATAR[persona.archetype_name] || "\u{1F464}";
  const badge = current.live
    ? `<span class="model-badge live">\u{1F916} ${model}</span>`
    : `<span class="model-badge">\u{1F4DC} scripted</span>`;
  return `
    <div class="avatar">${avatar}<span class="thinking-badge">\u{1F914}</span></div>
    ${badge}
    <div class="name">${persona.archetype_name}</div>
    <div class="dice-row" id="dice-${i}"></div>
  `;
}

function renderRevealedDice(i, hand, matchFace) {
  const row = $("dice-" + i);
  row.innerHTML = hand.map((d) => dieFaceHTML(d, matchFace)).join("");
}

function setActiveSeat(i) {
  document.querySelectorAll(".seat").forEach((el) => el.classList.remove("active-turn"));
  if (i != null) $("seat-" + i).classList.add("active-turn");
}

function clearThinking() {
  document.querySelectorAll(".seat.thinking").forEach((el) => el.classList.remove("thinking"));
}

function logLine(html, cls) {
  const log = $("round-log");
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

let roundNum = 0;

// One handler per real event kind streamed from the server, in the exact
// order they actually happened -- board state (billboard, active seat,
// dice) reacts to every raw event regardless of how routine it is; the
// round-log ticker only ever gets fed by "highlight" events, the curated
// subset engine/tournament_watchers.py's HighlightWatcher decided was
// worth narrating. That split is deliberate, not an oversight: the board
// must reflect everything live, the same "board updates regardless of
// the filter" rule from the design conversation.
async function handleStreamEvent(ev) {
  switch (ev.kind) {
    case "preflight":
      consoleLine(ev.text);
      await sleep(PACE.preflight);
      break;

    case "table_ready": {
      current = ev;
      const n = current.personas.length;
      let seatsHTML = "";
      for (let i = 0; i < n; i++) {
        seatsHTML += `<div class="seat" id="seat-${i}">${seatHTML(i, current.personas[i], current.models[i])}</div>`;
      }
      $("table-wrap").insertAdjacentHTML("beforeend", seatsHTML);
      $("table-wrap").style.display = "block";
      $("round-log").style.display = "block";
      layoutSeats(n);
      // No dice to show yet -- the first round_start (moments away) is
      // what actually rolls and reveals every real hand. Dice rows start
      // empty rather than with placeholder "?" faces.
      // Per-seat model assignments now live in the roster panel beside the
      // board, not crammed into one long status string here.
      $("status").textContent = current.live
        ? "Live tournament -- watch the roster panel for each seat's model."
        : (current.live_requested ? "Ollama not reachable -- ran scripted instead." : "");
      renderRosterPanel();
      // The table assembles fully BEHIND the curtain, then it wipes open --
      // Scott's ask: "screen wipe/curtain, then board assembly" reads best
      // as the reveal happening once, not the seats popping in over top of
      // an already-open table.
      await sleep(300);
      $("curtain-left").classList.add("open");
      $("curtain-right").classList.add("open");
      await sleep(900);
      break;
    }

    case "round_start":
      roundNum++;
      // Real dice, visible the instant they're rolled -- not hidden behind
      // "?" until a reveal. Scott: "I'd rather we see them all the time;
      // before, during, and after each roll... I need to see the choices
      // and bluffs more visually." No matchFace yet -- there's no bid to
      // highlight against until the first raise lands.
      for (const idxStr of Object.keys(ev.hands)) {
        renderRevealedDice(Number(idxStr), ev.hands[idxStr], null);
      }
      // Palafox: no wild ones for anyone this round, forced opening from
      // whoever's down to their last die -- the round-label itself flags
      // it so the human sees the rule change before the first bid lands,
      // not just after the fact in the round-log.
      $("billboard").querySelector(".round-label").textContent =
        ev.is_palafox ? `round ${roundNum} · PALAFOX -- no wild ones` : `round ${roundNum}`;
      $("billboard").classList.toggle("palafox", !!ev.is_palafox);
      if (ev.is_palafox) sfxPalafox();
      $("billboard-value").textContent = "opening...";
      await sleep(PACE.roundStart);
      break;

    case "player_thinking":
      // Only meaningful for a seat with a live model assigned -- a
      // scripted negotiator resolves instantly, so the badge would flash
      // for a single frame at most either way, but skipping it for
      // scripted seats keeps the board from flickering needlessly.
      if (current.live && current.models[ev.player_index]) {
        $("seat-" + ev.player_index).classList.add("thinking");
      }
      break;

    case "round_raise":
      clearThinking();
      setActiveSeat(ev.player_index);
      sfxRaise();
      $("billboard-value").textContent = `≥ ${ev.bid.quantity} showing ${ev.bid.face}`;
      await sleep(PACE.turn);
      break;

    case "round_call": {
      clearThinking();
      setActiveSeat(null);
      $("billboard-value").textContent = "REVEALING...";
      await sleep(PACE.preReveal);
      for (const idxStr of Object.keys(ev.hands)) {
        renderRevealedDice(Number(idxStr), ev.hands[idxStr], ev.bid.face);
      }
      const flash = $("reveal-flash");
      flash.className = ev.bid_was_true ? "true" : "bluff";
      if (ev.bid_was_true) sfxTrue(); else sfxBluff();
      await sleep(PACE.verdictPause);
      // If the bid was true, the CALLER wrongly doubted an honest claim
      // and loses; if it was a bluff, the CLAIMANT got caught and loses --
      // matches the fix in engine/liars_dice.py exactly (that logic was
      // previously inverted there before tonight's bug fix). No dice-count
      // bookkeeping needed here anymore -- the next round_start reveals
      // the real (now smaller) hand straight from the server.
      await sleep(PACE.postRound);
      break;
    }

    case "round_spot_on": {
      // Highest-stakes reveal in the game -- right or wrong, it's the same
      // hand-reveal choreography as a normal call, but the dice swing goes
      // one direction only on a hit (claimant loses, caller gains -- see
      // engine/liars_dice.py's run_round) instead of the usual single loser.
      clearThinking();
      setActiveSeat(null);
      $("billboard-value").textContent = "SPOT ON CALL...";
      await sleep(PACE.preReveal);
      for (const idxStr of Object.keys(ev.hands)) {
        renderRevealedDice(Number(idxStr), ev.hands[idxStr], ev.bid.face);
      }
      const flash = $("reveal-flash");
      flash.className = ev.spot_on_correct ? "spoton-hit" : "spoton-miss";
      if (ev.spot_on_correct) sfxSpotOnHit(); else sfxSpotOnMiss();
      await sleep(PACE.verdictPause);
      // No dice-count bookkeeping needed -- same as round_call, the next
      // round_start reveals the real count straight from the server,
      // including the caller's die back on a successful Spot On.
      await sleep(PACE.postRound);
      break;
    }

    case "round_execution":
      clearThinking();
      setActiveSeat(ev.player_index);
      sfxExecuted();
      await sleep(PACE.execution);
      await sleep(PACE.postRound);
      break;

    case "player_eliminated":
      // The authoritative elimination signal -- fires once dice actually
      // hit zero, after whichever round_call/round_execution caused it.
      // Clears their dice row so a dimmed, eliminated seat doesn't keep
      // showing a "ghost" hand from the round that finished them off.
      $("seat-" + ev.player_index).classList.add("eliminated");
      $("dice-" + ev.player_index).innerHTML = "";
      break;

    case "highlight": {
      const cls = ev.level === "climax" ? "verdict-true" : (ev.level === "major" ? "verdict-bluff" : "");
      logLine(ev.text, cls);
      break;
    }

    case "tournament_winner":
      setActiveSeat(null);
      $("seat-" + ev.player_index).classList.add("winner");
      sfxWinner();
      $("billboard-value").textContent = "WINNER!";
      $("winner-banner").textContent = `${current.personas[ev.player_index].archetype_name} WINS THE POT`;
      $("winner-banner").style.display = "block";
      break;
  }
}

async function startTournament() {
  $("start-btn").disabled = true;
  $("console").innerHTML = "";
  $("console").style.display = "block";
  $("round-log").innerHTML = "";
  $("round-log").style.display = "none";
  $("winner-banner").style.display = "none";
  $("table-wrap").style.display = "none";
  $("curtain-left").classList.remove("open");
  $("curtain-right").classList.remove("open");
  $("reveal-flash").className = "";
  document.querySelectorAll(".seat").forEach((el) => el.remove());
  $("roster-panel").classList.remove("visible");
  $("roster-rows").innerHTML = "";
  roundNum = 0;

  const n = parseInt($("player-count").value, 10);
  const live = $("live-toggle").checked;
  $("status").textContent = "Connecting...";

  const queue = new EventQueue();
  (async () => {
    try {
      const resp = await fetch(`/api/run-tournament-stream?players=${n}&live=${live ? 1 : 0}`, { method: "POST" });
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.trim()) queue.push(JSON.parse(line));
        }
      }
    } catch (err) {
      consoleLine("Something went wrong: " + err.message);
    }
    queue.finish();
  })();

  while (true) {
    const ev = await queue.next();
    if (ev === null) break;
    await handleStreamEvent(ev);
  }

  $("start-btn").disabled = false;
}

window.addEventListener("resize", () => {
  const n = current ? current.personas.length : 0;
  if (n) layoutSeats(n);
});

$("start-btn").addEventListener("click", startTournament);
</script>
