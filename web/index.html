<meta charset="utf-8">
<title>Life Rolls</title>
<style>
  :root {
    --bg: #0b0714;
    --panel: #191228;
    --panel-2: #241a3a;
    --line: #3a2c56;
    --text: #eee9fb;
    --dim: #a99bcf;
    --accent: #f2b53c;
    --pulse: #58d1ff;
    --true: #34c77b;
    --bluff: #e6534f;
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }
  h1 { text-align: center; letter-spacing: 0.1em; font-size: 1.9rem; margin: 0 0 4px; text-shadow: 0 0 18px rgba(242,181,60,0.4); }
  .tagline { text-align: center; color: var(--dim); margin: 0 0 20px; font-size: 0.9rem; }

  .controls { display: flex; justify-content: center; gap: 14px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #1a1400; border: none; border-radius: 8px;
    padding: 10px 22px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  label { color: var(--dim); font-size: 0.85rem; }

  #status { text-align: center; color: var(--dim); min-height: 1.4em; margin-bottom: 14px; font-size: 0.9rem; }

  #reveal-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 999; }
  #reveal-flash.true { background: var(--true); animation: flashFade 0.6s ease-out; }
  #reveal-flash.bluff { background: var(--bluff); animation: flashFade 0.6s ease-out; }
  @keyframes flashFade { 0% { opacity: 0.3; } 100% { opacity: 0; } }

  #table-wrap {
    position: relative;
    width: 100%;
    max-width: 820px;
    height: 520px;
    margin: 0 auto 16px;
    display: none;
  }
  #table-surface {
    position: absolute;
    left: 50%; top: 50%;
    width: 78%; height: 70%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #2c2050 0%, #1a1430 65%, #0d0a1a 100%);
    border: 6px solid #3a2c56;
    box-shadow: 0 0 40px rgba(88, 60, 160, 0.35) inset;
  }
  .billboard {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 200px; text-align: center;
    background: #05070a; border: 3px solid var(--accent); border-radius: 12px;
    padding: 10px 14px; font-family: "Courier New", monospace; color: var(--accent);
    box-shadow: 0 0 18px rgba(242,181,60,0.35) inset;
  }
  .billboard .round-label { display: block; font-size: 0.62rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .billboard .bid-value { display: block; font-size: 1rem; font-weight: 700; margin-top: 4px; }

  .seat {
    position: absolute;
    width: 168px;
    transform: translate(-50%, -50%);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 10px 10px 8px;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s, opacity 0.5s, filter 0.5s;
  }
  .seat .avatar { font-size: 1.8rem; }
  .seat .name { font-weight: 700; font-size: 0.82rem; margin: 2px 0; }
  .seat .model-badge { display: inline-block; font-size: 0.6rem; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--dim); border: 1px solid var(--line); margin-bottom: 4px; }
  .seat .model-badge.live { color: var(--accent); border-color: var(--accent); background: rgba(242,181,60,0.12); }
  .seat .dice-row { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; min-height: 1.6em; }
  .seat .die { font-size: 1.3rem; line-height: 1; }
  .seat .die.hidden { color: var(--dim); font-size: 1rem; }
  .seat .die.match { color: var(--true); text-shadow: 0 0 8px rgba(52,199,123,0.8); }
  .seat.active-turn { border-color: var(--pulse); box-shadow: 0 0 22px rgba(88,209,255,0.55); }
  .seat.eliminated { opacity: 0.35; filter: grayscale(1); }
  .seat.eliminated .name::after { content: " \2620 OUT"; color: var(--bluff); }
  .seat.winner { border-color: var(--accent); box-shadow: 0 0 30px rgba(242,181,60,0.75); animation: winnerPulse 1s ease-in-out infinite alternate; }
  @keyframes winnerPulse { from { box-shadow: 0 0 20px rgba(242,181,60,0.5); } to { box-shadow: 0 0 38px rgba(242,181,60,0.9); } }

  .round-log {
    max-width: 640px;
    margin: 0 auto 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    min-height: 90px;
    max-height: 160px;
    overflow-y: auto;
    display: none;
  }
  .round-log div { padding: 2px 0; opacity: 0; animation: fadein 0.35s forwards; }
  .round-log .banner { color: var(--accent); font-weight: 700; text-align: center; margin: 6px 0; }
  .round-log .verdict-true { color: var(--true); font-weight: 700; }
  .round-log .verdict-bluff { color: var(--bluff); font-weight: 700; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .winner-banner {
    max-width: 640px; margin: 16px auto 0; text-align: center;
    font-size: 1.3rem; font-weight: 800; color: var(--accent);
    display: none; text-shadow: 0 0 20px rgba(242,181,60,0.6);
  }
</style>

<div id="reveal-flash"></div>
<h1>LIFE ROLLS</h1>
<p class="tagline">liar's dice. death on the line, one lie at a time.</p>

<div class="controls">
  <label>players
    <select id="player-count">
      <option value="5" selected>5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
    </select>
  </label>
  <button id="start-btn">Start Tournament</button>
  <label><input type="checkbox" id="live-toggle" checked> live Ollama (falls back to scripted)</label>
</div>
<div id="status"></div>

<div id="table-wrap">
  <div id="table-surface"></div>
  <div class="billboard" id="billboard">
    <span class="round-label">round -</span>
    <span class="bid-value" id="billboard-value">waiting...</span>
  </div>
</div>

<div class="round-log" id="round-log"></div>
<div class="winner-banner" id="winner-banner"></div>

<footer style="text-align:center; margin-top:32px; font-size:0.8rem;">
  <a href="about.html" target="_blank" rel="noopener noreferrer" style="color:var(--dim); text-decoration:none;">About</a>
</footer>

<script>
const AVATAR = {
  "The CFO": "\u{1F4BC}", "The Executor": "\u{1F4DC}", "The Union Rep": "✊",
  "The Founder": "\u{1F680}", "The Diplomat": "\u{1F91D}", "The Adjuster": "\u{1F9EE}",
  "The Diner Owner": "\u{1F373}", "The Night-Shift Nurse": "\u{1F3E5}",
  "The Long-Haul Trucker": "\u{1F69A}", "The Immigrant Shop Owner": "\u{1F3EA}",
  "The Gig Worker": "\u{1F4F1}",
};
const DIE_GLYPH = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

const $ = (id) => document.getElementById(id);
let current = null;
let diceCounts = [];

// ---- sound: synthesized tones via Web Audio API, no audio files needed.
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, duration, type, peakGain) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  gain.gain.setValueAtTime(0, ctx.currentTime + start);
  gain.gain.linearRampToValueAtTime(peakGain || 0.15, ctx.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + duration + 0.05);
}
function sfxRaise() { tone(520, 0, 0.1, "triangle", 0.1); }
function sfxCall() { tone(180, 0, 0.3, "sawtooth", 0.15); tone(140, 0.05, 0.3, "sawtooth", 0.12); }
function sfxExecuted() { tone(110, 0, 0.5, "square", 0.18); tone(90, 0.15, 0.5, "square", 0.15); }
function sfxTrue() { tone(523, 0, 0.15, "sine", 0.15); tone(659, 0.1, 0.2, "sine", 0.16); }
function sfxBluff() { tone(220, 0, 0.2, "sawtooth", 0.18); tone(196, 0.15, 0.35, "sawtooth", 0.18); }
function sfxWinner() { tone(523, 0, 0.15, "sine", 0.15); tone(659, 0.12, 0.15, "sine", 0.15); tone(784, 0.24, 0.4, "sine", 0.2); }

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Named, tunable in one place -- a full tournament needs a structural
// minimum of (players-1) * HAND_SIZE lost rounds before one winner
// remains (engine/liars_dice.py's HAND_SIZE=3), so with 5 players that's
// at least 12 rounds no matter how fast any single beat animates. These
// values are picked to keep a full run watchable in well under a minute
// even at that floor -- Scott's rule: "needs to go fast enough for
// people to enjoy."
const PACE = {
  roundStart: 150,
  turn: 180,
  execution: 200,
  preReveal: 150,
  verdictPause: 500,
  postRound: 150,
};

function layoutSeats(n) {
  const wrap = $("table-wrap");
  const rect = wrap.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const rx = rect.width * 0.44, ry = rect.height * 0.40;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + rx * Math.cos(angle);
    const y = cy + ry * Math.sin(angle);
    const seat = $("seat-" + i);
    seat.style.left = x + "px";
    seat.style.top = y + "px";
  }
}

function seatHTML(i, persona, model) {
  const avatar = AVATAR[persona.archetype_name] || "\u{1F464}";
  const badge = current.live
    ? `<span class="model-badge live">\u{1F916} ${model}</span>`
    : `<span class="model-badge">\u{1F4DC} scripted</span>`;
  return `
    <div class="avatar">${avatar}</div>
    ${badge}
    <div class="name">${persona.archetype_name}</div>
    <div class="dice-row" id="dice-${i}"></div>
  `;
}

function renderHiddenDice(i) {
  const row = $("dice-" + i);
  row.innerHTML = Array.from({ length: diceCounts[i] })
    .map(() => `<span class="die hidden">?</span>`).join("");
}

function renderRevealedDice(i, hand, matchFace) {
  const row = $("dice-" + i);
  row.innerHTML = hand.map((d) => {
    const isMatch = matchFace != null && (d === matchFace || (matchFace !== 1 && d === 1));
    return `<span class="die${isMatch ? " match" : ""}">${DIE_GLYPH[d]}</span>`;
  }).join("");
}

function setActiveSeat(i) {
  document.querySelectorAll(".seat").forEach((el) => el.classList.remove("active-turn"));
  if (i != null) $("seat-" + i).classList.add("active-turn");
}

function logLine(html, cls) {
  const log = $("round-log");
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function playTournament() {
  const n = current.personas.length;
  diceCounts = new Array(n).fill(3); // HAND_SIZE -- see engine/liars_dice.py

  const surface = $("table-surface");
  const table = $("table-wrap");
  let seatsHTML = "";
  for (let i = 0; i < n; i++) {
    seatsHTML += `<div class="seat" id="seat-${i}">${seatHTML(i, current.personas[i], current.models[i])}</div>`;
  }
  table.insertAdjacentHTML("beforeend", seatsHTML);
  table.style.display = "block";
  $("round-log").style.display = "block";
  layoutSeats(n);
  for (let i = 0; i < n; i++) renderHiddenDice(i);

  await sleep(200);

  for (let r = 0; r < current.rounds.length; r++) {
    const round = current.rounds[r];
    const aliveNow = diceCounts.map((c, i) => c > 0 ? i : -1).filter((i) => i >= 0);
    logLine(`ROUND ${r + 1} -- dice re-rolled (${aliveNow.length} players in)`, "banner");
    $("billboard").querySelector(".round-label").textContent = `round ${r + 1}`;
    $("billboard-value").textContent = "opening...";
    aliveNow.forEach((i) => renderHiddenDice(i));
    await sleep(PACE.roundStart);

    for (const turn of round.turns_log) {
      setActiveSeat(turn.player_index);
      const name = current.personas[turn.player_index].archetype_name;
      if (turn.move === "raise") {
        sfxRaise();
        $("billboard-value").textContent = `≥ ${turn.bid.quantity} showing ${turn.bid.face}`;
        logLine(`<b>${name}</b> raises: at least ${turn.bid.quantity} showing ${turn.bid.face} <span style="color:var(--dim)">(${turn.reason})</span>`);
      } else {
        sfxCall();
        logLine(`<b>${name}</b> CALLS! <span style="color:var(--dim)">(${turn.reason})</span>`);
      }
      // Deliberately snappy -- the server already fully computed every
      // round (including any live Ollama round-trips) before this
      // response ever arrived, so how fast playback animates here is a
      // pure UX choice, not gated by real model latency. Scott's rule
      // applies to this too: "needs to go fast enough for people to enjoy."
      await sleep(PACE.turn);
    }

    if (round.executed_index != null) {
      setActiveSeat(round.executed_index);
      sfxExecuted();
      const name = current.personas[round.executed_index].archetype_name;
      logLine(`<b>${name}</b> FROZE -- EXECUTED for hesitating.`, "verdict-bluff");
      await sleep(PACE.execution);
    } else {
      // Reveal every alive hand, highlighting dice matching the bid's face.
      setActiveSeat(null);
      $("billboard-value").textContent = "REVEALING...";
      await sleep(PACE.preReveal);
      for (const idxStr of Object.keys(round.hands)) {
        renderRevealedDice(Number(idxStr), round.hands[idxStr], round.bid.face);
      }
      const flash = $("reveal-flash");
      flash.className = round.bid_was_true ? "true" : "bluff";
      if (round.bid_was_true) sfxTrue(); else sfxBluff();
      const claimantName = current.personas[round.claimant_index].archetype_name;
      const callerName = current.personas[round.caller_index].archetype_name;
      const verdict = round.bid_was_true ? "TRUE" : "A BLUFF";
      logLine(`Actual count: <b>${round.actual_count}</b>. ${claimantName}'s bid was <b>${verdict}</b> -- `
        + `${callerName} called it.`, round.bid_was_true ? "verdict-true" : "verdict-bluff");
      await sleep(PACE.verdictPause);
      for (let i = 0; i < n; i++) if (diceCounts[i] > 0) renderHiddenDice(i);
    }

    diceCounts[round.loser_index] -= 1;
    if (diceCounts[round.loser_index] <= 0) {
      $("seat-" + round.loser_index).classList.add("eliminated");
      logLine(`<b>${current.personas[round.loser_index].archetype_name}</b> is OUT.`, "verdict-bluff");
    }
    await sleep(PACE.postRound);
  }

  setActiveSeat(null);
  $("seat-" + current.winner_index).classList.add("winner");
  sfxWinner();
  $("billboard-value").textContent = "WINNER!";
  $("winner-banner").textContent = `${current.personas[current.winner_index].archetype_name} WINS THE POT`;
  $("winner-banner").style.display = "block";
  $("start-btn").disabled = false;
}

async function startTournament() {
  $("start-btn").disabled = true;
  $("round-log").innerHTML = "";
  $("round-log").style.display = "none";
  $("winner-banner").style.display = "none";
  $("table-wrap").style.display = "none";
  $("reveal-flash").className = "";
  document.querySelectorAll(".seat").forEach((el) => el.remove());

  const n = parseInt($("player-count").value, 10);
  const live = $("live-toggle").checked;
  $("status").textContent = live ? "Rolling live -- this can take a while for a full tournament..." : "Rolling...";

  try {
    const resp = await fetch(`/api/run-tournament?players=${n}&live=${live ? 1 : 0}`, { method: "POST" });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    current = data;
  } catch (err) {
    $("status").textContent = "Something went wrong: " + err.message;
    $("start-btn").disabled = false;
    return;
  }

  $("status").textContent = current.live
    ? "live: " + current.personas.map((p, i) => `${p.archetype_name} -> ${current.models[i]}`).join(", ")
    : (current.live_requested ? "Ollama not reachable -- ran scripted instead." : "");

  await playTournament();
}

window.addEventListener("resize", () => {
  const n = current ? current.personas.length : 0;
  if (n) layoutSeats(n);
});

$("start-btn").addEventListener("click", startTournament);
</script>
