<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Life Rolls — Standings</title>
<style>
  :root {
    --bg: #0b0714; --panel: #191228; --panel-2: #241a3a; --line: #3a2c56;
    --text: #eee9fb; --dim: #a99bcf; --accent: #f2b53c; --pulse: #58d1ff;
    --true: #34c77b; --bluff: #e6534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, var(--bg) 60%);
    color: var(--text); min-height: 100vh; padding: 32px 16px 80px; font-size: 16px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: 2.4em; margin: 0; letter-spacing: 3px; text-align: center;
    background: linear-gradient(90deg, var(--accent), #fff6d8, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(242,181,60,0.35);
  }
  .subtitle { color: var(--dim); letter-spacing: 1.5px; text-align: center; margin-top: 4px; margin-bottom: 8px; }
  .backlink { display: block; text-align: center; color: var(--dim); margin-bottom: 28px; text-decoration: none; }
  .backlink:hover { color: var(--accent); }

  .summary-bar {
    display: flex; justify-content: center; gap: 28px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 24px; margin-bottom: 28px;
  }
  .summary-stat { text-align: center; }
  .summary-stat .num { font-size: 1.6em; font-weight: 700; color: var(--accent); }
  .summary-stat .label { font-size: 0.8em; color: var(--dim); letter-spacing: 0.5px; }

  h2 { letter-spacing: 2px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-top: 36px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--panel-2); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 600; letter-spacing: 0.5px; font-size: 0.85em; }
  tr:hover td { background: rgba(88,209,255,0.06); }
  .rank-1 { color: var(--accent); font-weight: 700; }
  .table-scroll { overflow-x: auto; }
  .live-tag { color: var(--pulse); }
  .scripted-tag { color: var(--dim); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; margin-top: 18px; }
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: -30%; right: -30%; width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(242,181,60,0.18), transparent 70%);
  }
  .card .model-name { font-size: 1.1em; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
  .card .sub { font-size: 0.8em; color: var(--dim); margin-top: 2px; }
  .card .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 14px; }
  .card .stat .v { font-size: 1.2em; font-weight: 700; }
  .card .stat .l { font-size: 0.7em; color: var(--dim); letter-spacing: 0.5px; text-transform: uppercase; }

  .empty { text-align: center; color: var(--dim); margin-top: 60px; font-size: 1.1em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>STANDINGS</h1>
  <div class="subtitle">Every recorded tournament, aggregated by model</div>
  <a class="backlink" href="/">&larr; Back to Life Rolls</a>

  <div id="content"></div>
</div>

<script>
function pct(x) { return x === null || x === undefined ? '—' : Math.round(x * 100) + '%'; }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function load() {
  const content = document.getElementById('content');
  let data;
  try {
    const res = await fetch('/api/stats');
    data = await res.json();
  } catch (e) {
    content.innerHTML = '<div class="empty">Could not reach the Life Rolls server. Is it running?</div>';
    return;
  }
  if (!data.tournaments_recorded) {
    content.innerHTML = '<div class="empty">No tournaments recorded yet — play at least one full tournament, then check back here.</div>';
    return;
  }

  let html = '';
  html += `<div class="summary-bar">
    <div class="summary-stat"><div class="num">${data.tournaments_recorded}</div><div class="label">Tournaments Recorded</div></div>
    <div class="summary-stat"><div class="num">${data.rounds_recorded}</div><div class="label">Rounds Recorded</div></div>
    <div class="summary-stat"><div class="num">${data.models.length}</div><div class="label">Models Tracked</div></div>
  </div>`;

  html += `<h2>Leaderboard</h2>`;
  html += `<div class="table-scroll"><table><thead><tr>
    <th>Model</th><th>Tournaments</th><th>Wins</th><th>Win %</th>
    <th>Call Accuracy</th><th>Spot Ons</th><th>Spot On %</th>
    <th>Ace-Switches</th><th>Dice Lost</th><th>Dice Gained</th><th>Executions</th>
  </tr></thead><tbody>`;
  data.models.forEach((m, i) => {
    html += `<tr class="${i === 0 ? 'rank-1' : ''}">
      <td>${i === 0 ? '\u{1F451} ' : ''}${m.model}</td>
      <td>${m.tournaments_played}</td>
      <td>${m.wins}</td>
      <td>${pct(m.win_rate)}</td>
      <td>${pct(m.call_accuracy)} (${m.calls_correct}/${m.calls_made})</td>
      <td>${m.spot_ons_attempted}</td>
      <td>${pct(m.spot_on_accuracy)}</td>
      <td>${m.ace_switches_made}</td>
      <td>${m.dice_lost}</td>
      <td>${m.dice_gained}</td>
      <td>${m.executions}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  html += `<h2>Player Cards</h2><div class="cards">`;
  data.models.forEach(m => {
    html += `<div class="card">
      <div class="model-name">${m.model}</div>
      <div class="sub">${m.wins} win${m.wins === 1 ? '' : 's'} · ${m.tournaments_played} tournament${m.tournaments_played === 1 ? '' : 's'}</div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${pct(m.win_rate)}</div><div class="l">Win Rate</div></div>
        <div class="stat"><div class="v">${pct(m.call_accuracy)}</div><div class="l">Call Accuracy</div></div>
        <div class="stat"><div class="v">${pct(m.spot_on_accuracy)}</div><div class="l">Spot On Accuracy</div></div>
        <div class="stat"><div class="v">${m.ace_switches_made}</div><div class="l">Ace-Switches</div></div>
      </div>
    </div>`;
  });
  html += `</div>`;

  if (data.recent_tournaments && data.recent_tournaments.length) {
    html += `<h2>Recent Tournaments</h2>`;
    html += `<div class="table-scroll"><table><thead><tr>
      <th>When</th><th>Mode</th><th>Players</th><th>Rounds</th><th>Winner</th>
    </tr></thead><tbody>`;
    data.recent_tournaments.forEach(t => {
      const modeTag = t.live ? '<span class="live-tag">live</span>' : '<span class="scripted-tag">scripted</span>';
      const winnerLabel = t.winner_model ? `${t.winner_archetype} (${t.winner_model})` : (t.winner_archetype || '—');
      html += `<tr>
        <td style="text-align:left">${fmtDate(t.started_at)}</td>
        <td>${modeTag}</td>
        <td>${t.num_players}</td>
        <td>${t.total_rounds ?? '—'}</td>
        <td>${winnerLabel}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  content.innerHTML = html;
}

load();
</script>
</body>
</html>
