<meta charset="utf-8">
<title>Life Rolls — Live Diagram</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #171a22; --line: #2b3040; --text: #eef0f5;
    --dim: #8a90a6; --accent: #f2b53c; --pulse: #58d1ff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); margin: 0; padding: 20px;
    font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
  }
  h1 { text-align: center; font-size: 1.4rem; letter-spacing: 0.06em; margin: 0 0 4px; }
  .tagline { text-align: center; color: var(--dim); font-size: 0.85rem; margin: 0 0 18px; }
  .controls { display: flex; justify-content: center; gap: 12px; align-items: center; margin-bottom: 18px; }
  button {
    background: var(--accent); color: #1a1400; border: none; border-radius: 8px;
    padding: 9px 18px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  label { color: var(--dim); font-size: 0.85rem; }
  a.nav { color: var(--dim); font-size: 0.8rem; text-decoration: none; }
  a.nav:hover { color: var(--accent); }

  #stage {
    position: relative;
    width: 900px;
    max-width: 100%;
    height: 460px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  svg#lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  svg#lines line { stroke: var(--line); stroke-width: 2; }

  .node {
    position: absolute;
    width: 150px;
    transform: translate(-50%, -50%);
    background: #1f2330;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    font-size: 0.82rem;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .node .kind { color: var(--dim); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .node .name { font-weight: 700; margin-top: 2px; }
  .node.active {
    border-color: var(--pulse);
    background: #202a38;
    box-shadow: 0 0 18px rgba(88, 209, 255, 0.45);
  }

  .pulse-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--pulse);
    box-shadow: 0 0 10px 2px rgba(88, 209, 255, 0.8);
    transform: translate(-50%, -50%);
    transition: left 0.5s linear, top 0.5s linear, opacity 0.2s linear;
    opacity: 0;
    pointer-events: none;
  }

  #ticker {
    max-width: 900px;
    margin: 16px auto 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--dim);
    height: 90px;
    overflow-y: auto;
  }
  #ticker div { padding: 2px 0; }
  #ticker div.new { color: var(--text); }
</style>

<h1>LIFE ROLLS — LIVE DIAGRAM</h1>
<p class="tagline">the negotiation engine publishes once; the bus fans it out to everything watching</p>

<div class="controls">
  <button id="run-btn">Run a Case</button>
  <label><input type="checkbox" id="live-toggle" checked> live Ollama</label>
  <a class="nav" href="/index.html">&larr; back to the show</a>
</div>

<div id="stage">
  <svg id="lines"></svg>
  <!-- node positions are fixed for v0 -- see NODES below, kept in sync with these percentages -->
  <div class="node" id="node-engine" style="left:9%; top:50%;">
    <div class="kind">publisher</div><div class="name">Negotiation Engine</div>
  </div>
  <div class="node" id="node-bus" style="left:38%; top:50%;">
    <div class="kind">bus</div><div class="name">Event Bus</div>
  </div>
  <div class="node" id="node-audience" style="left:75%; top:15%;">
    <div class="kind">watcher</div><div class="name">Audience</div>
  </div>
  <div class="node" id="node-host" style="left:75%; top:38%;">
    <div class="kind">watcher</div><div class="name">Host</div>
  </div>
  <div class="node" id="node-stats" style="left:75%; top:61%;">
    <div class="kind">watcher</div><div class="name">Stats</div>
  </div>
  <div class="node" id="node-state" style="left:75%; top:84%;">
    <div class="kind">watcher</div><div class="name">State</div>
  </div>
</div>

<div id="ticker"></div>

<script>
const STAGE = document.getElementById("stage");
const NODES = {
  engine: "node-engine", bus: "node-bus", audience: "node-audience",
  host: "node-host", stats: "node-stats", state: "node-state",
};

function nodeCenter(id) {
  const el = document.getElementById(id);
  const stageRect = STAGE.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2 - stageRect.left, y: r.top + r.height / 2 - stageRect.top };
}

function drawLine(fromId, toId) {
  const a = nodeCenter(fromId), b = nodeCenter(toId);
  const svg = document.getElementById("lines");
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
  line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
  svg.appendChild(line);
}

function drawAllLines() {
  document.getElementById("lines").innerHTML = "";
  drawLine(NODES.engine, NODES.bus);
  for (const target of ["audience", "host", "stats", "state"]) {
    drawLine(NODES.bus, NODES[target]);
  }
}
window.addEventListener("resize", drawAllLines);
drawAllLines();

function flash(nodeId) {
  const el = document.getElementById(nodeId);
  el.classList.add("active");
  setTimeout(() => el.classList.remove("active"), 500);
}

function pulseAlong(fromId, toId, delay) {
  setTimeout(() => {
    const a = nodeCenter(fromId), b = nodeCenter(toId);
    const dot = document.createElement("div");
    dot.className = "pulse-dot";
    dot.style.left = a.x + "px";
    dot.style.top = a.y + "px";
    STAGE.appendChild(dot);
    requestAnimationFrame(() => { dot.style.opacity = "1"; });
    setTimeout(() => {
      dot.style.left = b.x + "px";
      dot.style.top = b.y + "px";
    }, 20);
    setTimeout(() => { flash(toId); }, 520);
    setTimeout(() => {
      dot.style.opacity = "0";
      setTimeout(() => dot.remove(), 220);
    }, 520);
  }, delay);
}

function logLine(text) {
  const ticker = document.getElementById("ticker");
  const div = document.createElement("div");
  div.className = "new";
  div.textContent = text;
  ticker.appendChild(div);
  ticker.scrollTop = ticker.scrollHeight;
  setTimeout(() => div.classList.remove("new"), 800);
}

function handleEvent(payload) {
  if (payload.kind === "meta") {
    logLine(`[${payload.label}]`);
    return;
  }
  flash(NODES.engine);
  pulseAlong(NODES.engine, NODES.bus, 0);
  (payload.targets || []).forEach((target, i) => {
    pulseAlong(NODES.bus, NODES[target], 550 + i * 80);
  });
  logLine(`${payload.kind} -> ${payload.label}`);
}

async function runCase() {
  document.getElementById("ticker").innerHTML = "";
  document.getElementById("run-btn").disabled = true;
  const live = document.getElementById("live-toggle").checked;

  const resp = await fetch(`/api/run-case-stream?live=${live ? 1 : 0}`, { method: "POST" });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      handleEvent(JSON.parse(line));
    }
  }
  document.getElementById("run-btn").disabled = false;
}

document.getElementById("run-btn").addEventListener("click", runCase);
</script>
